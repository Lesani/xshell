[package]
name = "xshelld"
version = "1.5.0"
edition = "2021"
license = "MIT"
publish = false
# File::try_lock (the single-instance lock) is stable since 1.89.
rust-version = "1.89"
description = "xshell Remote Host daemon"

[lib]
path = "src/lib.rs"

[[bin]]
name = "xshelld"
path = "src/main.rs"

[dependencies]
xshell-core = { path = "../core" }
xshell-protocol = { path = "../protocol", features = ["relay-client"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
# Wipes the serialized Ring keys after writing them (already in the tree via xshell-protocol).
zeroize = "=1.8.2"
# ConPTY on Windows, a pty elsewhere.
portable-pty = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
md5 = { workspace = true }
tempfile = "3"
xshell-hostlink = { path = "../hostlink" }
xshell-protocol = { path = "../protocol", features = ["test-relay"] }
# Reads the Codex `-c notify=…` override in tests the way Codex does.
toml = "0.9"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
