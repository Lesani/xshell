[package]
name = "xshell-core"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
xshell-protocol = { path = "../protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
portable-pty = { workspace = true }
rusqlite = { workspace = true }
md5 = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
# The hook client's deadline-bound socket (non-blocking connect and poll).
libc = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Parses the Codex `-c` overrides in tests the way Codex does (values are TOML).
toml = "0.9"
