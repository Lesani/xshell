[package]
name = "xshell-core"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
xshell-protocol = { path = "../protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
portable-pty = { workspace = true }
rusqlite = { workspace = true }
md5 = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
# The hook client's deadline-bound socket (non-blocking connect and poll).
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Named pipes (the Daemon's endpoint), their owner check, and Job Objects.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
] }

[dev-dependencies]
tempfile = "3"
# Parses the Codex `-c` overrides in tests the way Codex does (values are TOML).
toml = "0.9"
