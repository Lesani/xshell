[package]
name = "xshell-pairing-access"
version = "0.0.0"
edition = "2021"
publish = false
rust-version = "1.89"
[dependencies]
xshell-hostlink = { path = "../hostlink" }
xshell-protocol = { path = "../protocol", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
ring = "=0.17.14"
time = "=0.3.47"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
zeroize = "=1.8.2"
[target.'cfg(unix)'.dependencies]
libc = "=0.2.185"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
