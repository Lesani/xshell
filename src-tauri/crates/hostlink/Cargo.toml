[package]
name = "xshell-hostlink"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "The Desktop's client side of Remote Hosts: transport, link, install and supervision"

[dependencies]
xshell-core = { path = "../core" }
xshell-protocol = { path = "../protocol", features = ["relay-client"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
semver = { workspace = true }
# Splits a Host's launch prefixes into argv words with POSIX shell quoting.
shlex = "1.3"
# Wipes the serialized Ring keys after writing them (already in the tree via xshell-protocol).
zeroize = "=1.8.2"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = "3"
xshell-protocol = { path = "../protocol", features = ["test-relay"] }
