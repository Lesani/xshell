[workspace]
members = [".", "crates/core", "crates/protocol", "crates/xshelld", "crates/hostlink", "crates/buildinfo", "crates/pairing-access"]
# Vendored, patched crates (see each one's XSHELL-PATCH.md): not workspace members.
exclude = ["vendor"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
portable-pty = "0.9"
# Cursor stores chat history in per-chat SQLite (store.db, WAL mode) — bundled so we don't
# depend on a system libsqlite. md5: Cursor keys chat folders by md5 of the workspace cwd.
rusqlite = { version = "0.31", features = ["bundled"] }
md5 = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
semver = "1"

[package]
name = "xshell"
version = "1.5.0"
edition = "2021"

[lib]
name = "xshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
xshell-buildinfo = { path = "crates/buildinfo" }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { workspace = true }
serde_json = { workspace = true }
portable-pty = { workspace = true }
uuid = { workspace = true }
xshell-core = { path = "crates/core" }
xshell-protocol = { path = "crates/protocol" }
xshell-hostlink = { path = "crates/hostlink" }
xshell-pairing-access = { path = "crates/pairing-access" }
dirs = { workspace = true }
# All already in the tree via tauri-plugin-updater: no new crates.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["sync"] }
sha2 = "0.10"
# The pairing QR code (Settings → Mobile); no image or SVG renderers, the UI draws it.
qrcode = { version = "=0.14.1", default-features = false }
# Opens explorer files in their default app (Lesani/xshell#46): ShellExecuteExW on Windows
# (no `cmd /c start`, which mangles `&` and `^` in names), `open` on macOS, xdg-open / gio on
# Linux. Not tauri-plugin-opener: its versions for tauri 2.10 pull in zbus.
open = { version = "=5.4.4", features = ["shellexecute-on-windows"] }
# Already in the tree (tauri): canonical paths without the `\\?\` prefix on Windows.
dunce = "=1.0.5"
# Native drag of explorer files out to the OS (Lesani/xshell#46). Vendored and patched: see
# vendor/drag/XSHELL-PATCH.md. New in the tree on Windows: windows 0.52, windows-core 0.58.
drag = "=2.1.1"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Already in the tree (xshell-core): file identity for the open-copies install check.
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
# Already in the tree (xshell-protocol, xshell-core): a fake Host's chunks in tests.
base64 = "=0.22.1"

# Dev profile: fast incremental rebuilds, light optimization for deps
# The ConPTY input pipe for replies' writes that must not block (Lesani/xshell#40).
[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
# Drops that GTK reported as done but that never landed (drag-rs#84), panics on runtime paths.
drag = { path = "vendor/drag" }

[profile.dev]
incremental = true
opt-level = 0
debug = true

# Slight optimization for dependencies (faster linking, smaller artifacts)
# without losing debug info in our own code
[profile.dev.package."*"]
opt-level = 1
debug = false

# Release profile: optimize for size + strip debug symbols.
# Tauri release builds produced ~1.5 GB of intermediate artifacts; these
# settings reduce disk usage significantly and also shrink the final binary.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

# The Daemon's release build. `panic = "abort"` above would turn one panicking `call` into a
# dead Daemon and every Terminal hung up; xshelld catches panics per call, which needs unwind.
# Cargo does not allow `panic` per package, hence a separate profile for xshelld artefacts.
[profile.release-daemon]
inherits = "release"
panic = "unwind"
