name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and macOS bundle the xshelld sidecar (tauri.daemon.conf.json): local
          # Terminals run in a GUI-bound Daemon (ADR-0005). Windows does not yet (#24).
          - platform: macos-latest
            args: '--target universal-apple-darwin --config src-tauri/tauri.daemon.conf.json'
          - platform: ubuntu-22.04
            args: '--config src-tauri/tauri.daemon.conf.json'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # The sidecar the app starts as its GUI-bound Daemon. Its own profile keeps
      # `panic = "unwind"` (see Cargo.toml). Tauri finds it as binaries/xshelld-<triple> and
      # installs it as `xshelld` next to the app's executable.
      - name: Build the xshelld sidecar
        if: matrix.platform != 'windows-latest'
        shell: bash
        working-directory: src-tauri
        run: |
          mkdir -p binaries
          if [ "${{ matrix.platform }}" = macos-latest ]; then
            for t in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build -p xshelld --profile release-daemon --locked --target "$t"
            done
            lipo -create -output binaries/xshelld-universal-apple-darwin \
              target/aarch64-apple-darwin/release-daemon/xshelld \
              target/x86_64-apple-darwin/release-daemon/xshelld
          else
            cargo build -p xshelld --profile release-daemon --locked
            triple="$(rustc -vV | sed -n 's/^host: //p')"
            cp target/release-daemon/xshelld "binaries/xshelld-$triple"
          fi

      - name: Build and publish (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'xshell ${{ github.ref_name }}'
          releaseBody: |
            See the assets below to download and install this version.

            Binaries are not yet code-signed:
            - **Windows:** SmartScreen will warn — click *More info → Run anyway*.
            - **macOS:** right-click the app → *Open* (twice) on first launch.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Upload the raw xshell.exe (portable build, no installer wrapper) so the
      # npm wrapper can fetch it directly without triggering a UAC install dialog.
      - name: Upload portable Windows binary
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp src-tauri/target/release/xshell.exe "xshell_${VERSION}_x64.exe"
          gh release upload "${GITHUB_REF_NAME}" "xshell_${VERSION}_x64.exe" --clobber

  # The Desktop downloads xshelld-<triple> and its .sha256 from the release of its own
  # version (src-tauri/src/hosts/binaries.rs). The sidecar is a sha256sum line.
  xshelld-assets:
    needs: publish-tauri
    # On a tag the assets go into the draft release, so the desktop job must have created it.
    # Branch dry runs (workflow_dispatch) build the daemon even if desktop publishing fails.
    if: ${{ !cancelled() && (needs.publish-tauri.result == 'success' || !startsWith(github.ref, 'refs/tags/v')) }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rusqlite (bundled) compiles C; each musl target builds natively with musl-gcc on a
      # runner of its own architecture.
      - name: Install musl-tools
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      - name: Build (musl-gcc)
        if: endsWith(matrix.target, '-linux-musl')
        shell: bash
        run: |
          cc_var="CC_$(echo '${{ matrix.target }}' | tr '-' '_')"
          export "$cc_var=musl-gcc"
          cargo build -p xshelld --profile release-daemon --target ${{ matrix.target }} --locked

      - name: Build (native)
        if: endsWith(matrix.target, '-apple-darwin')
        run: cargo build -p xshelld --profile release-daemon --target ${{ matrix.target }} --locked

      - name: Stage asset and checksum
        shell: bash
        run: |
          name="xshelld-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release-daemon/xshelld" "$name"
          if [[ "${{ matrix.target }}" == *linux-musl ]]; then
            file "$name"
            file "$name" | grep -Eq 'statically linked|static-pie linked'
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$name" > "$name.sha256"
          else
            shasum -a 256 "$name" > "$name.sha256"
          fi
          cat "$name.sha256"
          ls -l "$name" "$name.sha256"

      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="xshelld-${{ matrix.target }}"
          gh release upload "${GITHUB_REF_NAME}" "$name" "$name.sha256" --clobber

      # Dry runs (workflow_dispatch on a branch) keep the files as a workflow artifact.
      - name: Upload workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: xshelld-${{ matrix.target }}
          path: |
            src-tauri/xshelld-${{ matrix.target }}
            src-tauri/xshelld-${{ matrix.target }}.sha256
